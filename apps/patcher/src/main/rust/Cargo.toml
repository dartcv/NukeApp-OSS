[package]
name = "nuke-patch-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "nuke_patch_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "=0.21.1", default-features = false }
libc = "=0.2.186"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = { version = "=0.11.1", default-features = false }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.20.0"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
panic = "unwind"
