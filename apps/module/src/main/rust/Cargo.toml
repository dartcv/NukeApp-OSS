[package]
name = "nuke-protocol-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "nuke_protocol_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "=0.22.4", default-features = false }
sha2 = { version = "=0.10.8", default-features = false }
serde_json = "=1.0.150"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.20.0"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
panic = "unwind"
