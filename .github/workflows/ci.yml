name: CI

on:
  push:
    branches: [dev, master]
    tags: ["v*"]
  pull_request:
    branches: [dev, master]

# A push is never cancelled by the next one, so every commit that reaches dev gets its build and every tag its release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Conventional Commits in English
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ "$BEFORE_SHA" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            # A new branch, or a force push that dropped the old tip from the history: only the new head is known.
            range="$PUSH_SHA~1..$PUSH_SHA"
          else
            range="$BEFORE_SHA..$PUSH_SHA"
          fi
          python3 tools/check_commit_msg.py --range "$range"

  intake-scripts:
    name: Intake scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the issue and pull request checks
        run: node --test .github/scripts/intake.test.cjs

  build:
    name: Verify (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.13113456" "cmake;4.1.2"

      - name: Install Rust 1.90.0
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy \
            --target aarch64-linux-android --target x86_64-linux-android
          python3 tools/build_rust.py --check

      - name: Cache pinned native sources
        uses: actions/cache@v6
        with:
          path: |
            build/native/deps
            ~/.cargo/registry
            ~/.cargo/git
          key: deps-${{ hashFiles('apps/module/src/main/cpp/dependencies.lock.json', 'apps/*/src/main/rust/Cargo.lock', 'apps/patcher/lspatch.lock.json') }}

      # Only a push has the release key. A pull request builds an unsigned Release, which is all a fork can get. The key
      # goes into the ignored local.properties on the runner, where the build already reads it, and is never printed.
      - name: Restore the release key
        if: ${{ github.event_name == 'push' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret SIGN_${name} is not set, so a push cannot produce a signed Release."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "signing.storeFile=$keystore"
            echo "signing.storePassword=$KEYSTORE_PASSWORD"
            echo "signing.keyAlias=$KEY_ALIAS"
            echo "signing.keyPassword=$KEY_PASSWORD"
          } >> local.properties

      - name: Verify
        run: ./gradlew verifyRelease --max-workers=1 --console=plain

      - name: Show APK checksums
        if: success()
        run: |
          {
            echo "### Release APKs"
            echo "| APK | SHA-256 |"
            echo "| :-- | :-- |"
            for apk in apps/module/build/outputs/apk/release/*.apk apps/patcher/build/outputs/apk/release/*.apk; do
              echo "| $(basename "$apk") | $(sha256sum "$apk" | cut -d' ' -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: |
            apps/module/build/outputs/apk/release/*.apk
            apps/patcher/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

  # Publishes the signed Release APKs of a v* tag as a GitHub release, after the build job has verified that commit. A tag
  # containing a hyphen (v1.0.0-beta.1) is a prerelease.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      # The full history and tags give the commits since the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-apks
          path: apks

      - name: Write the release notes
        run: python3 .github/scripts/release.py markdown "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Collect the APKs and their checksums
        run: |
          mkdir assets
          find apks -name '*.apk' -exec mv {} assets/ \;
          (cd assets && sha256sum *.apk > SHA256SUMS)
          cat assets/SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          name: NukeApp-OSS ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: assets/*
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Posts the published release to the CI channel: its notes as the caption of its signed APKs. Only a v* tag gets here,
  # never a branch push. Needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID. The APKs are far below the 50 MB the cloud Bot
  # API accepts, so no local Bot API server is needed.
  telegram:
    name: Post to Telegram
    runs-on: ubuntu-latest
    needs: release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-apks
          path: apks

      - name: Send
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/release.py telegram "$GITHUB_REF_NAME" --send apks
