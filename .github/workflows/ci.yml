name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# A push is never cancelled by the next one, so every commit that reaches dev gets its build and its Telegram post.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Conventional Commits in English
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ "$BEFORE_SHA" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            # A new branch, or a force push that dropped the old tip from the history: only the new head is known.
            range="$PUSH_SHA~1..$PUSH_SHA"
          else
            range="$BEFORE_SHA..$PUSH_SHA"
          fi
          python3 tools/check_commit_msg.py --range "$range"

  intake-scripts:
    name: Intake scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the issue and pull request checks
        run: node --test .github/scripts/intake.test.cjs

  build:
    name: Verify (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.13113456" "cmake;4.1.2"

      - name: Install Rust 1.90.0
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy \
            --target aarch64-linux-android --target x86_64-linux-android
          python3 tools/build_rust.py --check

      - name: Cache pinned native sources
        uses: actions/cache@v4
        with:
          path: |
            build/native/deps
            ~/.cargo/registry
            ~/.cargo/git
          key: deps-${{ hashFiles('apps/module/src/main/cpp/dependencies.lock.json', 'apps/*/src/main/rust/Cargo.lock', 'apps/patcher/lspatch.lock.json') }}

      # Only a push has the release key. A pull request builds an unsigned Release, which is all a fork can get. The key
      # goes into the ignored local.properties on the runner, where the build already reads it, and is never printed.
      - name: Restore the release key
        if: ${{ github.event_name == 'push' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret SIGN_${name} is not set, so a push cannot produce a signed Release."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "signing.storeFile=$keystore"
            echo "signing.storePassword=$KEYSTORE_PASSWORD"
            echo "signing.keyAlias=$KEY_ALIAS"
            echo "signing.keyPassword=$KEY_PASSWORD"
          } >> local.properties

      - name: Verify
        run: ./gradlew verifyRelease --max-workers=1 --console=plain

      - name: Show APK checksums
        if: success()
        run: |
          {
            echo "### Release APKs"
            echo "| APK | SHA-256 |"
            echo "| :-- | :-- |"
            for apk in apps/module/build/outputs/apk/release/*.apk apps/patcher/build/outputs/apk/release/*.apk; do
              echo "| $(basename "$apk") | $(sha256sum "$apk" | cut -d' ' -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            apps/module/build/outputs/apk/release/*.apk
            apps/patcher/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

  # Posts the signed Release APKs of a commit that reached dev or master to the CI channel. Needs TELEGRAM_BOT_TOKEN and
  # TELEGRAM_CHAT_ID. The APKs are far below the 50 MB the cloud Bot API accepts, so no local Bot API server is needed.
  telegram:
    name: Post to Telegram
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: apks

      - name: Send
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, subprocess, glob, sys

          # MarkdownV2 only needs ` and \ escaped inside code, and ) and \ inside a link target.
          def code(text): return text.replace("\\", "\\\\").replace("`", "\\`")
          def link(text): return text.replace("\\", "\\\\").replace(")", "\\)")

          # Attribution trailers say nothing about the change and would only use up the caption.
          lines = [line for line in os.environ["COMMIT_MESSAGE"].strip().splitlines() if not line.lower().startswith("co-authored-by:")]
          message = "\n".join(lines).strip()
          author = os.environ["COMMIT_AUTHOR"]
          url = os.environ["COMMIT_URL"]

          def build(text):
              return f"New push to GitHub\\!\n```\n{code(text)}\n```by `{code(author)}`\n[See the commit]({link(url)})"

          # A caption holds at most 1024 characters. A longer message is cut at the end, so the title always stays.
          caption = build(message)
          if len(caption) > 1024:
              low, high = 0, len(message)
              while low < high:
                  middle = (low + high + 1) // 2
                  if len(build(message[:middle].rstrip() + "...")) <= 1024: low = middle
                  else: high = middle - 1
              caption = build(message[:low].rstrip() + "...")

          files = sorted(glob.glob("apks/**/*.apk", recursive=True))
          if not files:
              sys.exit("no APK to send")
          media = [{"type": "document", "media": f"attach://file{i}"} for i in range(len(files))]
          media[-1].update({"caption": caption, "parse_mode": "MarkdownV2"})
          command = ["curl", "--fail-with-body", "--silent", "--show-error",
                     f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMediaGroup",
                     # --form-string: -F would cut the JSON at the first ';' of the caption.
                     "--form-string", f"chat_id={os.environ['CHAT_ID']}", "--form-string", f"media={json.dumps(media)}"]
          for i, path in enumerate(files):
              command += ["-F", f"file{i}=@{path}"]
          result = subprocess.run(command, capture_output=True, text=True)
          # The token is in the URL, so never print the command.
          print(result.stdout[:500], result.stderr[:500])
          sys.exit(result.returncode)
          PY
