[versions]
agp = "9.1.1"
kotlin = "2.4.10"
ksp = "2.3.13"
junit = "4.13.2"
xposed = "82"
libxposed = "102.0.0"
compose-bom = "2026.09.00"
activity = "1.12.4"
lifecycle = "2.10.0"
coroutines = "1.10.2"
dexkit = "2.3.0"
fastkv = "3.0.1"
gifkt = "0.3.3"
hiddenapibypass = "6.2"
silkCodec = "1.0.6"
dexmaker = "2.28.6"
haze = "2.0.1"
phosphorIcon = "1.0.0"
kavaref = "1.1.1"
quickjsKt = "1.0.15"
markdownRenderer = "0.45.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
xposed-api = { module = "de.robv.android.xposed:api", version.ref = "xposed" }
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
phosphor-icon = { module = "com.adamglin:phosphor-icon", version.ref = "phosphorIcon" }
quickjs-kt = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjsKt" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
markdown-renderer-code = { module = "com.mikepenz:multiplatform-markdown-renderer-code", version.ref = "markdownRenderer" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
dexkit = { module = "org.luckypray:dexkit", version.ref = "dexkit" }
kavaref-core = { module = "com.highcapable.kavaref:kavaref-core", version.ref = "kavaref" }
kavaref-extension = { module = "com.highcapable.kavaref:kavaref-extension", version.ref = "kavaref" }
kavaref-android = { module = "com.highcapable.kavaref:kavaref-android", version.ref = "kavaref" }
fastkv = { module = "io.github.billywei01:fastkv", version.ref = "fastkv" }
gifkt = { module = "com.shakster:gifkt", version.ref = "gifkt" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
silk-codec = { module = "com.github.YunJavaPro:Silk-Codec-Android", version.ref = "silkCodec" }
dexmaker = { module = "com.linkedin.dexmaker:dexmaker", version.ref = "dexmaker" }
